project:
  type: website
  output-dir: _site

# --- Solutions switches: set a session to true to publish its solutions link
# on the Templates & Materials page (see materials.qmd). ---
solutions1: true
solutions2: false
solutions3: false
solutions4: false

website:
  title: "Experimental Programming in the Cognitive Sciences"
  description: "Master's Programme in Brain and Cognition — jsPsych course"
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    left: "Experimental Programming in the Cognitive Sciences — Master's Programme in Brain and Cognition"
    right: "Built with [Quarto](https://quarto.org)"
  sidebar:
    style: "docked"
    search: true
    contents:
      - text: "Course Manual"
        href: index.qmd
      - section: "Sessions"
        contents:
          - text: "1. Foundations"
            href: sessions/session1.qmd
          - text: "2. Trial Design"
            href: sessions/session2.qmd
          - text: "3. Real Data"
            href: sessions/session3.qmd
          - text: "4. Going Live"
            href: sessions/session4.qmd
      - text: "Templates & Materials"
        href: materials.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true

execute:
  eval: false
  echo: true
