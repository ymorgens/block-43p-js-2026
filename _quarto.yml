project:
  type: website
  output-dir: _site

# --- Visibility switches (true = show, false = hide) ---------------------
# session1..4   : show the session page and its template download.
#                 When false, the page says "Coming Soon..." and the
#                 template link on Templates & Materials is hidden.
# solutions1..4 : show the solutions download on Templates & Materials.
# After changing a value: commit, push and run the workflow.
session1: true
session2: true
session3: false
session4: false
solutions1: true
solutions2: false
solutions3: false
solutions4: false

website:
  title: "Experimental Programming in the Cognitive Sciences"
  description: "Master's Programme in Brain and Cognition — jsPsych course"
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    left: "Experimental Programming in the Cognitive Sciences — Master's Programme in Brain and Cognition"
    right: "Built with [Quarto](https://quarto.org)"
  sidebar:
    style: "docked"
    search: true
    contents:
      - text: "Course Manual"
        href: index.qmd
      - section: "Sessions"
        contents:
          - text: "1. Foundations"
            href: sessions/session1.qmd
          - text: "2. Trial Design"
            href: sessions/session2.qmd
          - text: "3. Real Data"
            href: sessions/session3.qmd
          - text: "4. Going Live"
            href: sessions/session4.qmd
      - text: "Templates & Materials"
        href: materials.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true

execute:
  eval: false
  echo: true
